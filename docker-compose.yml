# Local full deployment: the review server plus a probe sidecar that keeps
# scores fresh (recency-weighted scoring is only honest if probes keep
# running). Both share one SQLite volume; WAL mode handles the two writers.
#
# To run against Postgres instead (matching a Railway + Neon deploy), set
# DATABASE_URL on both services — e.g. uncomment the `postgres` service below
# and add `DATABASE_URL: postgres://filterly:filterly@postgres:5432/filterly`
# to each service's environment. When DATABASE_URL is set, the SQLite volume is
# unused.
services:
  web:
    build: .
    ports:
      - "4117:4117"
    volumes:
      - filterly-data:/data
    environment:
      FILTERLY_NAME: Filterly
    restart: unless-stopped

  probe:
    build: .
    command: ["node", "dist/bin/probe.js", "probes/targets.json", "--watch", "300"]
    volumes:
      - filterly-data:/data
    environment:
      FILTERLY_DB: /data/filterly.db
      FILTERLY_PROBE_KEY: /data/probe-key.json
      FILTERLY_PROBE_LABEL: filterly probe fleet
    restart: unless-stopped

  # Uncomment to test the Postgres backend locally (then add DATABASE_URL to
  # the web + probe services as noted above):
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: filterly
  #     POSTGRES_PASSWORD: filterly
  #     POSTGRES_DB: filterly
  #   volumes:
  #     - filterly-pg:/var/lib/postgresql/data

volumes:
  filterly-data:
  # filterly-pg:
